server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # El HTML y el bootstrap deben revalidarse tras cada despliegue.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        expires -1;
        try_files $uri =404;
    }

    location = /version.json {
        expires -1;
        try_files $uri =404;
    }

    # CanvasKit y assets estáticos.
    location /canvaskit/ {
        expires 30d;
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location /icons/ {
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|otf|json)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Fallback para rutas del cliente (SPA / Flutter).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
